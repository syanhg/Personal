    <!-- Low-frequency noise nudges a clean outline so it wobbles like a pen stroke. -->

        <filter id="hand-drawn">
            <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="7"/>

        </filter>
    </svg>
